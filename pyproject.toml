[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focipy"
version = "0.3.1"
description = "Automated kinetics analysis of DNA repair protein recruitment at laser-induced damage sites."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-image>=0.21",
    "tifffile>=2023.7",
    "readlif>=0.6.5",
    "roifile>=2024.1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "pytest>=7.4",
    "ruff>=0.3",
]
cellpose = ["cellpose>=3.0"]
napari = ["napari[all]>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
focipy = "focipy.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]